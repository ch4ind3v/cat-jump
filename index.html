<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>小猫跳跳 - Doodle Jump</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(to bottom, #0f0c29 0%, #302b63 50%, #24243e 100%);
            overflow: hidden;
            font-family: 'Nunito', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block;
            margin: 0 auto;
        }
        #game-ui {
            position: absolute;
            top: 24px;
            left: 0;
            width: 100%;
            text-align: center;
            pointer-events: none;
            z-index: 5;
        }
        #score {
            font-size: 40px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.4), 0 0 25px rgba(255,215,0,0.4);
            letter-spacing: 2px;
            line-height: 1;
        }
        #high-score {
            font-size: 13px;
            color: rgba(255,255,255,0.6);
            margin-top: 6px;
            font-weight: 700;
            text-shadow: 0 1px 3px rgba(0,0,0,0.3);
            letter-spacing: 1px;
        }
        #start-screen, #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.35);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 10;
            transition: opacity 0.3s;
        }
        #start-screen h1 {
            font-size: 56px;
            font-weight: 900;
            color: #FFD700;
            text-shadow: 0 4px 15px rgba(0,0,0,0.5), 0 0 40px rgba(255,215,0,0.3);
            margin-bottom: 8px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
        #start-screen p {
            font-size: 18px;
            color: rgba(255,255,255,0.85);
            margin-bottom: 40px;
            font-weight: 700;
            text-shadow: 0 1px 5px rgba(0,0,0,0.3);
        }
        .btn {
            padding: 16px 50px;
            font-size: 22px;
            background: linear-gradient(135deg, #FFD700 0%, #FF8C00 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 900;
            color: #1a1a2e;
            box-shadow: 0 6px 25px rgba(255,140,0,0.45), 0 2px 5px rgba(0,0,0,0.2);
            transition: all 0.2s ease;
            pointer-events: all;
            font-family: 'Nunito', sans-serif;
            letter-spacing: 1px;
        }
        .btn:hover {
            transform: translateY(-3px) scale(1.06);
            box-shadow: 0 10px 30px rgba(255,140,0,0.55), 0 4px 10px rgba(0,0,0,0.25);
        }
        .btn:active {
            transform: translateY(1px) scale(0.97);
        }
        #game-over-screen h2 {
            font-size: 48px;
            font-weight: 900;
            color: #FF6B6B;
            margin-bottom: 18px;
            text-shadow: 0 3px 12px rgba(0,0,0,0.4);
        }
        #game-over-screen p {
            font-size: 22px;
            color: #fff;
            margin-bottom: 10px;
            font-weight: 700;
            text-shadow: 0 1px 5px rgba(0,0,0,0.3);
        }
        .hidden {
            display: none !important;
        }
        .controls-hint {
            margin-top: 28px;
            color: rgba(255,255,255,0.5);
            font-size: 13px;
            text-align: center;
            line-height: 1.9;
            font-weight: 400;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="game-ui">
        <div id="score">0</div>
        <div id="high-score">最高: 0</div>
    </div>
    
    <div id="start-screen">
        <h1>🐱 小猫跳跳</h1>
        <p>帮助小猫跳得更高！</p>
        <button class="btn" onclick="startGame()">开始游戏</button>
        <div class="controls-hint">
            电脑: ← → 方向键 或 A D 键<br>
            手机: 倾斜手机左右移动
        </div>
    </div>
    
    <div id="game-over-screen" class="hidden">
        <h2>游戏结束</h2>
        <p id="final-score">得分: 0</p>
        <p id="final-high">最高: 0</p>
        <button class="btn" onclick="restartGame()">再玩一次</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        let gameState = 'menu';
        let score = 0;
        let highScore = localStorage.getItem('catJumpHighScore') || 0;
        document.getElementById('high-score').textContent = '最高: ' + highScore;
        
        let cameraY = 0;
        let maxHeight = 0;
        
        const cat = {
            x: 0,
            y: 0,
            width: 40,
            height: 40,
            vx: 0,
            vy: 0,
            speed: 5,
            jumpPower: -13,
            gravity: 0.4,
            facing: 1,
            animFrame: 0,
            animTimer: 0
        };
        
        let platforms = [];
        const PLATFORM_WIDTH = 70;
        const PLATFORM_HEIGHT = 12;
        const PLATFORM_GAP_MIN = 50;
        const PLATFORM_GAP_MAX = 120;
        
        let clouds = [];
        let particles = [];
        let stars = [];
        
        const keys = {};
        let touchX = null;
        let tiltGamma = 0;
        let useTilt = false;
        let tiltRequested = false;
        
        function initCat() {
            cat.x = canvas.width / 2 - cat.width / 2;
            cat.y = canvas.height - 200;
            cat.vx = 0;
            cat.vy = cat.jumpPower;
            cat.facing = 1;
        }
        
        function createPlatform(y) {
            const types = ['normal', 'normal', 'normal', 'moving', 'fragile'];
            const type = types[Math.floor(Math.random() * types.length)];
            const x = Math.random() * (canvas.width - PLATFORM_WIDTH);
            
            return {
                x: x,
                y: y,
                width: PLATFORM_WIDTH,
                height: PLATFORM_HEIGHT,
                type: type,
                originalX: x,
                moveSpeed: type === 'moving' ? (Math.random() > 0.5 ? 2 : -2) : 0,
                moveRange: type === 'moving' ? 80 : 0,
                broken: false,
                breakTimer: 0
            };
        }
        
        function initPlatforms() {
            platforms = [];
            platforms.push({
                x: canvas.width / 2 - PLATFORM_WIDTH / 2,
                y: canvas.height - 50,
                width: PLATFORM_WIDTH + 40,
                height: PLATFORM_HEIGHT,
                type: 'normal',
                originalX: canvas.width / 2 - PLATFORM_WIDTH / 2 - 20,
                moveSpeed: 0,
                moveRange: 0,
                broken: false,
                breakTimer: 0
            });
            
            let currentY = canvas.height - 50;
            while (currentY > -canvas.height * 2) {
                currentY -= PLATFORM_GAP_MIN + Math.random() * (PLATFORM_GAP_MAX - PLATFORM_GAP_MIN);
                platforms.push(createPlatform(currentY));
            }
        }
        
        function initClouds() {
            clouds = [];
            for (let i = 0; i < 15; i++) {
                clouds.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height * 3,
                    width: 60 + Math.random() * 100,
                    speed: 0.1 + Math.random() * 0.4,
                    opacity: 0.1 + Math.random() * 0.3
                });
            }
        }
        
        function initStars() {
            stars = [];
            for (let i = 0; i < 100; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height * 4,
                    size: Math.random() * 2 + 0.5,
                    opacity: Math.random() * 0.8 + 0.2,
                    twinkle: Math.random() * Math.PI * 2
                });
            }
        }
        
        function generatePlatforms() {
            const topPlatform = platforms[platforms.length - 1];
            while (topPlatform.y + cameraY > -canvas.height) {
                const newY = topPlatform.y - PLATFORM_GAP_MIN - Math.random() * (PLATFORM_GAP_MAX - PLATFORM_GAP_MIN);
                platforms.push(createPlatform(newY));
                
                if (Math.random() < 0.05) {
                    const lastPlatform = platforms[platforms.length - 1];
                    springs.push({
                        x: lastPlatform.x + lastPlatform.width / 2 - 10,
                        y: lastPlatform.y - 15,
                        width: 20,
                        height: 15,
                        active: false,
                        compressTimer: 0
                    });
                }
            }
        }
        
        function cleanupPlatforms() {
            platforms = platforms.filter(p => p.y + cameraY < canvas.height + 100);
            springs = springs.filter(s => s.y + cameraY < canvas.height + 100);
        }
        
        let springs = [];
        
        window.catImage = new Image();
        window.catImage.src = 'mingzhi.png';
        
        function roundRect(ctx, x, y, w, h, r) {
            if (typeof r === 'number') r = {tl: r, tr: r, br: r, bl: r};
            ctx.beginPath();
            ctx.moveTo(x + r.tl, y);
            ctx.lineTo(x + w - r.tr, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r.tr);
            ctx.lineTo(x + w, y + h - r.br);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r.br, y + h);
            ctx.lineTo(x + r.bl, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r.bl);
            ctx.lineTo(x, y + r.tl);
            ctx.quadraticCurveTo(x, y, x + r.tl, y);
            ctx.closePath();
        }
        
        function drawCat() {
            ctx.save();
            const screenY = cat.y + cameraY;
            const cx = cat.x + cat.width / 2;
            const cy = screenY + cat.height / 2;
            
            ctx.translate(cx, cy);
            ctx.scale(cat.facing, 1);
            const tilt = Math.max(-0.35, Math.min(0.35, cat.vy * 0.025));
            ctx.rotate(tilt);
            ctx.translate(-cx, -cy);
            
            if (window.catImage.complete && window.catImage.naturalWidth > 0) {
                const imgSize = 55;
                ctx.shadowColor = 'rgba(0,0,0,0.25)';
                ctx.shadowBlur = 10;
                ctx.shadowOffsetY = 4;
                ctx.drawImage(window.catImage, cx - imgSize/2, cy - imgSize/2 + 2, imgSize, imgSize);
                ctx.shadowColor = 'transparent';
            } else {
                ctx.fillStyle = '#FFAA55';
                roundRect(ctx, cat.x, screenY, cat.width, cat.height, 10);
                ctx.fill();
                ctx.fillStyle = '#333';
                ctx.font = 'bold 20px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('🐱', cat.x + cat.width/2, screenY + 30);
            }
            
            ctx.restore();
        }
        
        function drawPlatform(p) {
            if (p.broken) return;
            
            const screenY = p.y + cameraY;
            if (screenY < -50 || screenY > canvas.height + 50) return;
            
            ctx.save();
            ctx.shadowColor = 'rgba(0,0,0,0.25)';
            ctx.shadowBlur = 8;
            ctx.shadowOffsetY = 4;
            const r = 6;
            
            if (p.type === 'normal') {
                roundRect(ctx, p.x, screenY, p.width, p.height, r);
                ctx.fillStyle = '#228B22';
                ctx.fill();
                
                roundRect(ctx, p.x, screenY, p.width, p.height * 0.55, {tl: r, tr: r, bl: 0, br: 0});
                ctx.fillStyle = '#7CFC00';
                ctx.fill();
                
                roundRect(ctx, p.x, screenY + p.height * 0.5, p.width, p.height * 0.5, {tl: 0, tr: 0, bl: r, br: r});
                ctx.fillStyle = '#8B4513';
                ctx.fill();
                
                ctx.fillStyle = '#ADFF2F';
                ctx.fillRect(p.x + 4, screenY + 1, p.width - 8, 2);
            } else if (p.type === 'moving') {
                roundRect(ctx, p.x, screenY, p.width, p.height, r);
                ctx.fillStyle = '#1E90FF';
                ctx.fill();
                
                roundRect(ctx, p.x + 2, screenY + 2, p.width - 4, p.height * 0.5, {tl: r-2, tr: r-2, bl: 0, br: 0});
                ctx.fillStyle = '#87CEFA';
                ctx.fill();
                
                ctx.shadowColor = 'transparent';
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 11px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('↔', p.x + p.width/2, screenY + 10);
            } else if (p.type === 'fragile') {
                roundRect(ctx, p.x, screenY, p.width, p.height, r);
                ctx.fillStyle = '#CD853F';
                ctx.fill();
                
                ctx.shadowColor = 'transparent';
                ctx.strokeStyle = '#8B4513';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(p.x + 12, screenY + 2);
                ctx.lineTo(p.x + 22, screenY + 7);
                ctx.lineTo(p.x + 32, screenY + 3);
                ctx.stroke();
            }
            
            ctx.restore();
        }
        
        function drawSprings() {
            springs.forEach(s => {
                const screenY = s.y + cameraY;
                if (screenY < -50 || screenY > canvas.height + 50) return;
                
                ctx.save();
                ctx.shadowColor = 'rgba(0,0,0,0.2)';
                ctx.shadowBlur = 5;
                ctx.shadowOffsetY = 3;
                
                ctx.fillStyle = '#FF4500';
                roundRect(ctx, s.x + 2, screenY, s.width - 4, s.height, 3);
                ctx.fill();
                
                ctx.fillStyle = '#FFD700';
                ctx.fillRect(s.x + 4, screenY + 2, s.width - 8, 3);
                ctx.fillStyle = '#FF6347';
                ctx.fillRect(s.x + 4, screenY + 7, s.width - 8, 4);
                
                ctx.restore();
            });
        }
        
        function drawClouds() {
            clouds.forEach(c => {
                const screenY = c.y + cameraY * 0.2;
                if (screenY < -120 || screenY > canvas.height + 120) return;
                
                ctx.fillStyle = `rgba(255, 255, 255, ${c.opacity})`;
                ctx.beginPath();
                ctx.arc(c.x, screenY, c.width * 0.25, 0, Math.PI * 2);
                ctx.arc(c.x + c.width * 0.25, screenY - c.width * 0.12, c.width * 0.3, 0, Math.PI * 2);
                ctx.arc(c.x + c.width * 0.5, screenY, c.width * 0.25, 0, Math.PI * 2);
                ctx.arc(c.x + c.width * 0.35, screenY + c.width * 0.08, c.width * 0.2, 0, Math.PI * 2);
                ctx.fill();
            });
        }
        
        function drawStars() {
            stars.forEach(s => {
                const screenY = s.y + cameraY * 0.08;
                if (screenY < -10 || screenY > canvas.height + 10) return;
                
                s.twinkle += 0.025;
                const alpha = s.opacity * (0.5 + 0.5 * Math.sin(s.twinkle));
                
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.beginPath();
                ctx.arc(s.x, screenY, s.size, 0, Math.PI * 2);
                ctx.fill();
            });
        }
        
        function drawParticles() {
            particles.forEach((p, i) => {
                p.life--;
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.08;
                
                if (p.life <= 0) {
                    particles.splice(i, 1);
                    return;
                }
                
                const alpha = p.life / 30;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y + cameraY, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            });
        }
        
        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 5,
                    vy: (Math.random() - 0.5) * 5 - 2,
                    life: 25 + Math.random() * 25,
                    color: color,
                    size: 2 + Math.random() * 5
                });
            }
        }
        
        function checkCollisions() {
            platforms.forEach(p => {
                if (p.broken) return;
                
                if (cat.vy > 0 &&
                    cat.x + cat.width > p.x &&
                    cat.x < p.x + p.width &&
                    cat.y + cat.height >= p.y &&
                    cat.y + cat.height - cat.vy <= p.y + p.height) {
                    
                    if (p.type === 'fragile') {
                        p.broken = true;
                        createParticles(p.x + p.width/2, p.y, '#DEB887', 10);
                        cat.vy = cat.jumpPower * 0.7;
                    } else {
                        cat.y = p.y - cat.height;
                        cat.vy = cat.jumpPower;
                        createParticles(cat.x + cat.width/2, cat.y + cat.height, '#7CFC00', 6);
                    }
                }
            });
            
            springs.forEach(s => {
                if (!s.active &&
                    cat.x + cat.width > s.x &&
                    cat.x < s.x + s.width &&
                    cat.y + cat.height >= s.y &&
                    cat.y + cat.height - cat.vy <= s.y + s.height) {
                    
                    cat.vy = cat.jumpPower * 1.8;
                    s.active = true;
                    s.compressTimer = 10;
                    createParticles(s.x + s.width/2, s.y, '#FFD700', 12);
                }
            });
        }
        
        function update() {
            if (gameState !== 'playing') return;
            
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
                cat.vx = -cat.speed;
                cat.facing = -1;
            } else if (keys['ArrowRight'] || keys['d'] || keys['D']) {
                cat.vx = cat.speed;
                cat.facing = 1;
            } else if (touchX !== null) {
                if (touchX < canvas.width / 2) {
                    cat.vx = -cat.speed;
                    cat.facing = -1;
                } else {
                    cat.vx = cat.speed;
                    cat.facing = 1;
                }
            } else {
                cat.vx *= 0.8;
            }
            
            cat.vy += cat.gravity;
            
            cat.x += cat.vx;
            cat.y += cat.vy;
            
            if (cat.x + cat.width < 0) {
                cat.x = canvas.width;
            } else if (cat.x > canvas.width) {
                cat.x = -cat.width;
            }
            
            // 相机跟随 - 保持小猫在屏幕偏下方（约60%处）
            const threshold = canvas.height * 0.6;
            const targetCameraY = threshold - cat.y;
            if (targetCameraY > cameraY) {
                cameraY = targetCameraY;
            }
            
            const currentHeight = Math.floor((canvas.height - 50 - cat.y) / 10);
            if (currentHeight > score) {
                score = currentHeight;
                document.getElementById('score').textContent = score;
            }
            
            generatePlatforms();
            cleanupPlatforms();
            
            platforms.forEach(p => {
                if (p.type === 'moving' && !p.broken) {
                    p.x += p.moveSpeed;
                    if (Math.abs(p.x - p.originalX) > p.moveRange) {
                        p.moveSpeed *= -1;
                    }
                    if (p.x < 0) p.x = 0;
                    if (p.x + p.width > canvas.width) p.x = canvas.width - p.width;
                }
                
                if (p.broken && p.breakTimer < 10) {
                    p.breakTimer++;
                }
            });
            
            springs.forEach(s => {
                if (s.compressTimer > 0) {
                    s.compressTimer--;
                    if (s.compressTimer === 0) s.active = false;
                }
            });
            
            checkCollisions();
            
            clouds.forEach(c => {
                c.x += c.speed;
                if (c.x > canvas.width + c.width) {
                    c.x = -c.width;
                    c.y = Math.random() * canvas.height - cameraY * 0.2;
                }
            });
            
            if (cat.y + cameraY > canvas.height + 50) {
                gameOver();
            }
        }
        
        function draw() {
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#0f0c29');
            gradient.addColorStop(0.5, '#302b63');
            gradient.addColorStop(1, '#24243e');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            drawStars();
            drawClouds();
            platforms.forEach(drawPlatform);
            drawSprings();
            drawCat();
            drawParticles();
        }
        
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        function handleOrientation(event) {
            tiltGamma = event.gamma || 0;
        }
        
        function requestTiltPermission() {
            if (tiltRequested) return;
            tiltRequested = true;
            
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') {
                            useTilt = true;
                            window.addEventListener('deviceorientation', handleOrientation);
                        }
                    })
                    .catch(() => {});
            } else {
                useTilt = true;
                window.addEventListener('deviceorientation', handleOrientation);
            }
        }
        
        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            
            score = 0;
            cameraY = 0;
            particles = [];
            springs = [];
            document.getElementById('score').textContent = '0';
            
            initCat();
            initPlatforms();
            initClouds();
            initStars();
            
            gameState = 'playing';
            requestTiltPermission();
        }
        
        function gameOver() {
            gameState = 'gameover';
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('catJumpHighScore', highScore);
            }
            
            document.getElementById('final-score').textContent = '得分: ' + score;
            document.getElementById('final-high').textContent = '最高: ' + highScore;
            document.getElementById('high-score').textContent = '最高: ' + highScore;
            document.getElementById('game-over-screen').classList.remove('hidden');
        }
        
        function restartGame() {
            startGame();
        }
        
        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) {
                e.preventDefault();
            }
        });
        
        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });
        
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            touchX = e.touches[0].clientX;
        }, { passive: false });
        
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            touchX = e.touches[0].clientX;
        }, { passive: false });
        
        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            touchX = null;
        }, { passive: false });
        
        canvas.addEventListener('mousedown', (e) => {
            touchX = e.clientX;
        });
        
        canvas.addEventListener('mousemove', (e) => {
            if (touchX !== null) {
                touchX = e.clientX;
            }
        });
        
        canvas.addEventListener('mouseup', () => {
            touchX = null;
        });
        
        canvas.addEventListener('mouseleave', () => {
            touchX = null;
        });
        
        initClouds();
        initStars();
        draw();
        gameLoop();
    </script>
</body>
</html>
