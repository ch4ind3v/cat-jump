    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        let gameState = 'menu';
        let score = 0;
        let highScore = localStorage.getItem('catJumpHighScore') || 0;
        document.getElementById('high-score').textContent = '最高: ' + highScore;
        
        let cameraY = 0;
        let maxHeight = 0;
        
        // ===== 音效系统 =====
        let audioCtx = null;
        let soundEnabled = true;
        
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }
        
        function playSound(type) {
            if (!soundEnabled || !audioCtx) return;
            
            const now = audioCtx.currentTime;
            
            switch(type) {
                case 'jump':
                    // 跳跃：快速上升的方波
                    {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(200, now);
                        osc.frequency.exponentialRampToValueAtTime(500, now + 0.08);
                        gain.gain.setValueAtTime(0.08, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                        osc.start(now);
                        osc.stop(now + 0.08);
                    }
                    break;
                    
                case 'spring':
                    // 弹簧：更高更长的上升音
                    {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(300, now);
                        osc.frequency.exponentialRampToValueAtTime(800, now + 0.15);
                        gain.gain.setValueAtTime(0.1, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                        osc.start(now);
                        osc.stop(now + 0.15);
                    }
                    break;
                    
                case 'land':
                    // 落地：短促的打击音
                    {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(150, now);
                        osc.frequency.exponentialRampToValueAtTime(50, now + 0.05);
                        gain.gain.setValueAtTime(0.12, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                        osc.start(now);
                        osc.stop(now + 0.05);
                    }
                    break;
                    
                case 'break':
                    // 碎裂平台：噪声爆发
                    {
                        const bufferSize = audioCtx.sampleRate * 0.1;
                        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                        const data = buffer.getChannelData(0);
                        for (let i = 0; i < bufferSize; i++) {
                            data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
                        }
                        const noise = audioCtx.createBufferSource();
                        const gain = audioCtx.createGain();
                        noise.buffer = buffer;
                        noise.connect(gain);
                        gain.connect(audioCtx.destination);
                        gain.gain.setValueAtTime(0.08, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                        noise.start(now);
                        noise.stop(now + 0.1);
                    }
                    break;
                    
                case 'gameover':
                    // 游戏结束：下降的音阶
                    {
                        const notes = [400, 350, 300, 200];
                        notes.forEach((freq, i) => {
                            const osc = audioCtx.createOscillator();
                            const gain = audioCtx.createGain();
                            osc.connect(gain);
                            gain.connect(audioCtx.destination);
                            osc.type = 'sawtooth';
                            osc.frequency.setValueAtTime(freq, now + i * 0.12);
                            gain.gain.setValueAtTime(0.06, now + i * 0.12);
                            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.1);
                            osc.start(now + i * 0.12);
                            osc.stop(now + i * 0.12 + 0.1);
                        });
                    }
                    break;
                    
                case 'revive':
                    // 复活：华丽的上升音阶
                    {
                        const notes = [300, 400, 500, 700, 900];
                        notes.forEach((freq, i) => {
                            const osc = audioCtx.createOscillator();
                            const gain = audioCtx.createGain();
                            osc.connect(gain);
                            gain.connect(audioCtx.destination);
                            osc.type = 'sine';
                            osc.frequency.setValueAtTime(freq, now + i * 0.08);
                            gain.gain.setValueAtTime(0.08, now + i * 0.08);
                            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.15);
                            osc.start(now + i * 0.08);
                            osc.stop(now + i * 0.08 + 0.15);
                        });
                    }
                    break;
                    
                case 'coin':
                    // 得分/金币：清脆的叮
                    {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(1200, now);
                        osc.frequency.exponentialRampToValueAtTime(1800, now + 0.05);
                        gain.gain.setValueAtTime(0.06, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                        osc.start(now);
                        osc.stop(now + 0.05);
                    }
                    break;
            }
        }
        
        // ===== 背景音乐系统（太空氛围） =====
        let bgmMasterGain = null;
        let bgmIntervalIds = [];
        let bgmOscillators = [];
        let bgmActive = false;
        let padChordIndex = 0;
        const padChords = [
            [110, 130.8, 164.8],   // Am: A2, C3, E3
            [174.6, 220, 261.6],   // F:  F3, A3, C4
            [130.8, 164.8, 196],   // C:  C3, E3, G3
            [196, 246.9, 293.7]    // G:  G3, B3, D4
        ];
        
        function startBGM() {
            if (!audioCtx) initAudio();
            if (!soundEnabled || bgmActive) return;
            bgmActive = true;
            
            // 创建主增益节点
            bgmMasterGain = audioCtx.createGain();
            bgmMasterGain.connect(audioCtx.destination);
            bgmMasterGain.gain.setValueAtTime(0, audioCtx.currentTime);
            bgmMasterGain.gain.linearRampToValueAtTime(0.05, audioCtx.currentTime + 2);
            
            startDroneLayer();
            scheduleNextPad();
            
            const sparkleId = setInterval(playSparkle, 2000 + Math.random() * 2000);
            bgmIntervalIds.push(sparkleId);
        }
        
        function startDroneLayer() {
            const droneConfig = [
                { freq: 55,   type: 'sine',     vol: 0.5,  lfoRate: 0.08, lfoDepth: 4 },   // A1
                { freq: 82.4, type: 'sine',     vol: 0.35, lfoRate: 0.12, lfoDepth: 6 },   // E2
                { freq: 110,  type: 'triangle', vol: 0.2,  lfoRate: 0.15, lfoDepth: 3 }    // A2
            ];
            
            droneConfig.forEach(cfg => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = cfg.type;
                osc.frequency.setValueAtTime(cfg.freq, audioCtx.currentTime);
                
                // LFO 调制 detune，产生呼吸感
                const lfo = audioCtx.createOscillator();
                const lfoGain = audioCtx.createGain();
                lfo.frequency.setValueAtTime(cfg.lfoRate, audioCtx.currentTime);
                lfoGain.gain.setValueAtTime(cfg.lfoDepth, audioCtx.currentTime);
                lfo.connect(lfoGain);
                lfoGain.connect(osc.detune);
                lfo.start();
                bgmOscillators.push(lfo);
                
                gain.gain.setValueAtTime(cfg.vol, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(bgmMasterGain);
                osc.start();
                bgmOscillators.push(osc);
            });
        }
        
        function scheduleNextPad() {
            if (!bgmActive) return;
            playPadChord(padChords[padChordIndex]);
            padChordIndex = (padChordIndex + 1) % padChords.length;
            const timeoutId = setTimeout(scheduleNextPad, 7000 + Math.random() * 2000);
            bgmIntervalIds.push(timeoutId);
        }
        
        function playPadChord(freqs) {
            if (!bgmActive || !bgmMasterGain) return;
            const now = audioCtx.currentTime;
            
            freqs.forEach(freq => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now);
                
                // 长 attack / release
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.06, now + 2);
                gain.gain.linearRampToValueAtTime(0.04, now + 4);
                gain.gain.linearRampToValueAtTime(0, now + 7);
                
                osc.connect(gain);
                gain.connect(bgmMasterGain);
                osc.start(now);
                osc.stop(now + 7.5);
                bgmOscillators.push(osc);
            });
        }
        
        function playSparkle() {
            if (!bgmActive || !bgmMasterGain || Math.random() > 0.5) return;
            const now = audioCtx.currentTime;
            // 太空闪烁音：E5-B6 范围随机
            const baseFreqs = [659.3, 783.9, 880, 1046.5, 1318.5, 1568];
            const freq = baseFreqs[Math.floor(Math.random() * baseFreqs.length)];
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.025, now + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4 + Math.random() * 0.6);
            osc.connect(gain);
            gain.connect(bgmMasterGain);
            osc.start(now);
            osc.stop(now + 1.2);
            bgmOscillators.push(osc);
        }
        
        function fadeOutBGM() {
            if (!bgmActive) return;
            bgmActive = false;
            
            if (bgmMasterGain && audioCtx) {
                try {
                    bgmMasterGain.gain.cancelScheduledValues(audioCtx.currentTime);
                    bgmMasterGain.gain.setValueAtTime(bgmMasterGain.gain.value, audioCtx.currentTime);
                    bgmMasterGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1.5);
                } catch (e) {}
            }
            
            bgmIntervalIds.forEach(id => clearTimeout(id));
            bgmIntervalIds = [];
            
            setTimeout(() => {
                bgmOscillators.forEach(osc => {
                    try { osc.stop(); } catch(e) {}
                });
                bgmOscillators = [];
                bgmMasterGain = null;
            }, 1600);
        }
        
        function stopBGM() {
            if (!bgmActive && !bgmMasterGain) return;
            bgmActive = false;
            
            bgmIntervalIds.forEach(id => clearTimeout(id));
            bgmIntervalIds = [];
            
            bgmOscillators.forEach(osc => {
                try { osc.stop(); } catch(e) {}
            });
            bgmOscillators = [];
            bgmMasterGain = null;
        }
        
        function toggleSound() {

            if (btn) btn.textContent = soundEnabled ? '🔊' : '🔇';
            
            if (soundEnabled) {

        // ===== 云端排行榜系统（Firebase Firestore）=====
        let leaderboardData = [];          // 当前缓存的云端排行榜
        let leaderboardUnsubscribe = null; // onSnapshot 取消函数
        let firebaseReady = false;         // 云端初始化完成标志
        let firebaseRetryCount = 0;        // Firebase 连接重试计数
        
        function getLocalLeaderboard() {
            try {
                return JSON.parse(localStorage.getItem('catJumpLeaderboard')) || [];
            } catch (e) {
                return [];
            }
        }
        
        function saveLocalLeaderboard(data) {
            localStorage.setItem('catJumpLeaderboard', JSON.stringify(data));
        }
        
        function initCloudLeaderboard() {
            if (!window.firebaseDb) {
                // Firebase 模块脚本可能还没加载完（deferred），延迟重试
                firebaseRetryCount++;
                if (firebaseRetryCount > 20) {
                    console.warn('Firebase SDK 加载超时，使用本地排行榜');
                    firebaseReady = false;
                    leaderboardData = getLocalLeaderboard();
                    renderLeaderboard();
                    return;
                }
                console.log('Firebase SDK 尚未加载，等待中... (' + firebaseRetryCount + ')');
                setTimeout(initCloudLeaderboard, 300);
                return;
            }
            
            const q = window.firebaseQuery(
                window.firebaseCollection(window.firebaseDb, 'scores'),
                window.firebaseOrderBy('score', 'desc'),
                window.firebaseLimit(50)
            );
            
            leaderboardUnsubscribe = window.firebaseOnSnapshot(q, (snapshot) => {
                leaderboardData = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    leaderboardData.push({
                        name: data.name || '匿名',
                        score: data.score || 0,
                        date: data.timestamp?.toMillis ? data.timestamp.toMillis() : Date.now()
                    });
                });
                firebaseReady = true;
                renderLeaderboard();
            }, (error) => {
                console.warn('Firebase 连接失败，回退到本地:', error);
                firebaseReady = false;
                leaderboardData = getLocalLeaderboard();
                renderLeaderboard();
            });
        }
        
        async function addScoreToCloud(name, score) {
            if (!window.firebaseDb) return false;
            try {
                await window.firebaseAddDoc(
                    window.firebaseCollection(window.firebaseDb, 'scores'),
                    {
                        name: name || '匿名',
                        score: score,
                        timestamp: window.firebaseServerTimestamp()
                    }
                );
                return true;
            } catch (e) {
                console.warn('提交云端失败:', e);
                return false;
            }
        }
        
        function addScore(name, score) {
            // 1. 尝试提交到云端（异步，不阻塞）
            addScoreToCloud(name, score);
            
            // 2. 同时更新本地（离线降级 + 个人历史记录）
            const board = getLocalLeaderboard();
            board.push({ name: name || '匿名', score: score, date: Date.now() });
            board.sort((a, b) => b.score - a.score);
            if (board.length > 20) board.length = 20;
            saveLocalLeaderboard(board);
            
            // 3. 如果云端未就绪，用本地数据刷新 UI
            if (!firebaseReady) {
                leaderboardData = board;
                renderLeaderboard();
            }
            // 云端就绪时，onSnapshot 会自动触发 renderLeaderboard
        }

            board.slice(0, 10).forEach((item, i) => {

        const cat = {

        function cleanupPlatforms() {

            platforms = platforms.filter(p => p.y + cameraY > -canvas.height * 2 && p.y + cameraY < canvas.height + 100);

        let springs = [];
        
        window.catImage = new Image();
        window.catImage.src = 'mingzhi.png?v=3';
        
        function roundRect(ctx, x, y, w, h, r) {
            if (typeof r === 'number') r = {tl: r, tr: r, br: r, bl: r};
            ctx.beginPath();
            ctx.moveTo(x + r.tl, y);
            ctx.lineTo(x + w - r.tr, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r.tr);
            ctx.lineTo(x + w, y + h - r.br);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r.br, y + h);
            ctx.lineTo(x + r.bl, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r.bl);
            ctx.lineTo(x, y + r.tl);
            ctx.quadraticCurveTo(x, y, x + r.tl, y);
            ctx.closePath();
        }
        
        function drawCat() {
            ctx.save();
            const screenY = cat.y + cameraY;
            const cx = cat.x + cat.width / 2;
            const cy = screenY + cat.height / 2;
            const imgSize = 55;
            
            // 呼吸效果（静止时轻微上下浮动）
            const breathe = Math.sin(Date.now() * 0.003) * 0.015;
            
            // 可爱的弹跳缩放：跳跃时压扁，下落时拉长
            const squash = Math.max(-0.15, Math.min(0.15, cat.vy * 0.008));
            const scaleX = cat.facing * (1 + squash);
            const scaleY = 1 - squash + breathe;
            
            // 尾巴摇摆（在画身体之前画，这样尾巴在身体后面）
            drawTail(cx, cy + 5, imgSize);
            
            ctx.translate(cx, cy);
            ctx.scale(scaleX, scaleY);
            ctx.translate(-cx, -cy);
            
            if (window.catImage.complete && window.catImage.naturalWidth > 0) {
                ctx.imageSmoothingEnabled = false;
                // 阴影
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.beginPath();
                ctx.ellipse(cx, cy + imgSize/2 - 2, imgSize * 0.35, imgSize * 0.1, 0, 0, Math.PI * 2);
                ctx.fill();
                // 明治本体
                ctx.drawImage(window.catImage, cx - imgSize/2, cy - imgSize/2 + 2, imgSize, imgSize);
                // 眼睛高光闪烁
                drawEyeSparkle(cx, cy);
                // 偶尔眨眼（画一条线覆盖眼睛）
                drawBlink(cx, cy);
            } else {
                ctx.fillStyle = '#FFAA55';
                roundRect(ctx, cat.x, screenY, cat.width, cat.height, 10);
                ctx.fill();
                ctx.fillStyle = '#333';
                ctx.font = 'bold 20px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('🐱', cat.x + cat.width/2, screenY + 30);
            }
            
            ctx.restore();
        }
        
        function drawTail(cx, cy, imgSize) {
            const time = Date.now() * 0.005;
            
            // 尾巴根部（身后偏下）
            const startX = cx - cat.facing * (imgSize * 0.32);
            const startY = cy + imgSize * 0.22;
            
            // 尾巴分成4段，每段不同摆动相位
            // 根部摆动小，尖端摆动大，形成S形
            const segments = 4;
            const segLen = 7;
            let points = [{x: startX, y: startY}];
            
            for (let i = 1; i <= segments; i++) {
                const t = time + i * 0.8;
                // 左右摆动幅度随段数增加
                const wagAmp = i * 2.5;
                const wag = Math.sin(t) * wagAmp;
                // 根部基本向下，尖端有更多侧摆
                const prev = points[i - 1];
                points.push({
                    x: prev.x - cat.facing * (wag * 0.3) + Math.cos(t * 0.5) * 1.5,
                    y: prev.y + segLen + Math.sin(t * 0.3) * 1
                });
            }
            
            // 用贝塞尔曲线平滑连接各段
            ctx.strokeStyle = '#D4B896';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            
            for (let i = 1; i < points.length - 1; i++) {
                const midX = (points[i].x + points[i + 1].x) / 2;
                const midY = (points[i].y + points[i + 1].y) / 2;
                ctx.quadraticCurveTo(points[i].x, points[i].y, midX, midY);
            }
            // 最后一段到尖端
            const last = points[points.length - 1];
            ctx.quadraticCurveTo(
                (points[points.length - 2].x + last.x) / 2,
                (points[points.length - 2].y + last.y) / 2,
                last.x, last.y
            );
            ctx.stroke();
            
            // 尾巴尖端小白毛（蓬松感）
            ctx.fillStyle = '#F5E6D3';
            ctx.beginPath();
            ctx.arc(last.x, last.y, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#E8D5C0';
            ctx.beginPath();
            ctx.arc(last.x - 1, last.y - 1, 2, 0, Math.PI * 2);
            ctx.fill();
        }
        
        function drawEyeSparkle(cx, cy) {
            // 眼睛高光闪烁
            const sparkle = Math.sin(Date.now() * 0.004);
            if (sparkle > 0.6) {
                const alpha = (sparkle - 0.6) * 2.5;
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                // 左眼高光
                ctx.beginPath();
                ctx.arc(cx - 6 * cat.facing, cy - 6, 1.8, 0, Math.PI * 2);
                ctx.fill();
                // 右眼高光
                ctx.beginPath();
                ctx.arc(cx + 6 * cat.facing, cy - 6, 1.8, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function drawBlink(cx, cy) {
            // 每3-4秒眨一次眼
            const blinkCycle = (Date.now() % 3500) / 3500;
            if (blinkCycle > 0.92 && blinkCycle < 0.97) {
                // 眨眼：画两条水平线覆盖眼睛
                ctx.strokeStyle = '#8B7355';
                ctx.lineWidth = 2;
                ctx.lineCap = 'round';
                // 左眼
                ctx.beginPath();
                ctx.moveTo(cx - 10 * cat.facing, cy - 5);
                ctx.lineTo(cx - 2 * cat.facing, cy - 5);
                ctx.stroke();
                // 右眼
                ctx.beginPath();
                ctx.moveTo(cx + 2 * cat.facing, cy - 5);
                ctx.lineTo(cx + 10 * cat.facing, cy - 5);
                ctx.stroke();
            }
        }
        
        function drawPlatform(p) {
            if (p.broken) return;
            
            const screenY = p.y + cameraY;
            if (screenY < -50 || screenY > canvas.height + 50) return;
            
            ctx.save();
            const r = 6;
            
            if (p.type === 'normal') {
                // 太空站金属平台
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 10;
                ctx.shadowOffsetY = 4;
                
                // 平台主体（深灰金属）
                roundRect(ctx, p.x, screenY, p.width, p.height, r);
                ctx.fillStyle = '#3a3a4a';
                ctx.fill();
                
                // 金属高光条
                ctx.fillStyle = '#5a5a6a';
                ctx.fillRect(p.x + 3, screenY + 2, p.width - 6, 3);
                
                // 铆钉/螺丝细节
                ctx.fillStyle = '#888899';
                ctx.beginPath();
                ctx.arc(p.x + 8, screenY + p.height/2, 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(p.x + p.width - 8, screenY + p.height/2, 2, 0, Math.PI * 2);
                ctx.fill();
                
                // 侧面厚度
                ctx.fillStyle = '#2a2a3a';
                roundRect(ctx, p.x, screenY + p.height * 0.6, p.width, p.height * 0.4, {tl: 0, tr: 0, bl: r, br: r});
                ctx.fill();
                
                ctx.shadowColor = 'transparent';
                
            } else if (p.type === 'moving') {
                // 能量平台（发光）
                ctx.shadowColor = 'rgba(0,200,255,0.5)';
                ctx.shadowBlur = 15;
                ctx.shadowOffsetY = 2;
                
                // 能量核心
                roundRect(ctx, p.x + 2, screenY + 2, p.width - 4, p.height - 4, r);
                ctx.fillStyle = '#0a2a3a';
                ctx.fill();
                
                // 发光边缘
                ctx.strokeStyle = '#00D4FF';
                ctx.lineWidth = 2;
                roundRect(ctx, p.x + 2, screenY + 2, p.width - 4, p.height - 4, r);
                ctx.stroke();
                
                // 中心能量条
                ctx.fillStyle = 'rgba(0, 212, 255, 0.6)';
                ctx.fillRect(p.x + 8, screenY + p.height/2 - 1, p.width - 16, 2);
                
                // 脉冲光点
                const pulse = 0.5 + 0.5 * Math.sin(Date.now() * 0.005);
                ctx.fillStyle = `rgba(0, 212, 255, ${pulse})`;
                ctx.beginPath();
                ctx.arc(p.x + p.width/2, screenY + p.height/2, 3, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.shadowColor = 'transparent';
                
            } else if (p.type === 'fragile') {
                // 碎裂小行星平台
                ctx.shadowColor = 'rgba(0,0,0,0.4)';
                ctx.shadowBlur = 6;
                ctx.shadowOffsetY = 2;
                
                // 岩石主体
                roundRect(ctx, p.x, screenY, p.width, p.height, r);
                ctx.fillStyle = '#5a4a3a';
                ctx.fill();
                
                // 陨石坑/裂纹
                ctx.fillStyle = '#3a2a1a';
                ctx.beginPath();
                ctx.arc(p.x + 15, screenY + 5, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(p.x + p.width - 12, screenY + 7, 3, 0, Math.PI * 2);
                ctx.fill();
                
                // 高亮边缘（即将碎裂的警告）
                ctx.strokeStyle = 'rgba(255, 100, 50, 0.4)';
                ctx.lineWidth = 1;
                roundRect(ctx, p.x + 1, screenY + 1, p.width - 2, p.height - 2, r);
                ctx.stroke();
                
                ctx.shadowColor = 'transparent';
            }
            
            ctx.restore();
        }
        
        function drawSprings() {
            springs.forEach(s => {
                const screenY = s.y + cameraY;
                if (screenY < -50 || screenY > canvas.height + 50) return;
                
                ctx.save();
                
                // 推进器底座
                ctx.fillStyle = '#4a4a5a';
                roundRect(ctx, s.x + 2, screenY + 5, s.width - 4, s.height - 5, 2);
                ctx.fill();
                
                // 推进器喷嘴
                ctx.fillStyle = '#FF4500';
                ctx.beginPath();
                ctx.moveTo(s.x + s.width/2, screenY + s.height);
                ctx.lineTo(s.x + 4, screenY + 5);
                ctx.lineTo(s.x + s.width - 4, screenY + 5);
                ctx.closePath();
                ctx.fill();
                
                // 火焰效果（如果激活）
                if (s.active || s.compressTimer > 0) {
                    ctx.fillStyle = `rgba(0, 212, 255, ${0.6 + Math.random() * 0.4})`;
                    ctx.beginPath();
                    ctx.moveTo(s.x + s.width/2, screenY + s.height + 8);
                    ctx.lineTo(s.x + 6, screenY + s.height);
                    ctx.lineTo(s.x + s.width - 6, screenY + s.height);
                    ctx.closePath();
                    ctx.fill();
                }
                
                ctx.restore();
            });
        }
        
        function drawClouds() {
            // 窗外夜景元素 - 月亮和远处的城市灯光
            clouds.forEach(c => {
                const screenY = c.y + cameraY * 0.2;
                if (screenY < -120 || screenY > canvas.height + 120) return;
                
                if (c.type === 'moon') {
                    // 月亮
                    ctx.fillStyle = `rgba(255, 240, 200, ${c.opacity})`;
                    ctx.beginPath();
                    ctx.arc(c.x, screenY, c.width * 0.3, 0, Math.PI * 2);
                    ctx.fill();
                    // 月光晕
                    ctx.fillStyle = `rgba(255, 240, 200, ${c.opacity * 0.1})`;
                    ctx.beginPath();
                    ctx.arc(c.x, screenY, c.width * 0.6, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // 远处建筑灯光
                    ctx.fillStyle = `rgba(200, 180, 140, ${c.opacity * 0.5})`;
                    ctx.beginPath();
                    ctx.arc(c.x, screenY, c.width * 0.2, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }
        
        function drawStars() {
            stars.forEach(s => {
                const screenY = s.y + cameraY * 0.08;
                if (screenY < -10 || screenY > canvas.height + 10) return;
                
                s.twinkle += 0.025;
                const alpha = s.opacity * (0.5 + 0.5 * Math.sin(s.twinkle));
                
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.beginPath();
                ctx.arc(s.x, screenY, s.size, 0, Math.PI * 2);
                ctx.fill();
            });
        }
        
        function drawParticles() {
            particles.forEach((p, i) => {
                p.life--;
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.08;
                
                if (p.life <= 0) {
                    particles.splice(i, 1);
                    return;
                }
                
                const alpha = p.life / 30;
                ctx.globalAlpha = alpha;
                
                if (p.isText) {
                    // 文字粒子（复活特效）
                    ctx.fillStyle = p.color;
                    ctx.font = 'bold 18px "Nunito", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(p.text, p.x, p.y + cameraY);
                } else {
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y + cameraY, p.size, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                ctx.globalAlpha = 1;
            });
        }
        
        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 5,
                    vy: (Math.random() - 0.5) * 5 - 2,
                    life: 25 + Math.random() * 25,
                    color: color,
                    size: 2 + Math.random() * 5
                });
            }
        }
        
        function checkCollisions() {
            platforms.forEach(p => {
                if (p.broken) return;
                
                if (cat.vy > 0 &&
                    cat.x + cat.width > p.x &&
                    cat.x < p.x + p.width &&
                    cat.y + cat.height >= p.y &&
                    cat.y + cat.height - cat.vy <= p.y + p.height) {
                    
                    if (p.type === 'fragile') {
                        p.broken = true;
                        createParticles(p.x + p.width/2, p.y, '#FF6B35', 12);
                        cat.vy = cat.jumpPower * 0.7;
                        playSound('break');
                    } else {
                        cat.y = p.y - cat.height;
                        cat.vy = cat.jumpPower;
                        playSound('jump');
                        // 落地火花（太空风格：蓝色+橙色火花）
                        createParticles(cat.x + cat.width/2, cat.y + cat.height, '#00D4FF', 6);
                        createParticles(cat.x + cat.width/2, cat.y + cat.height, '#FF8C42', 4);
                        // 落地小星星
                        for (let i = 0; i < 3; i++) {
                            particles.push({
                                x: cat.x + cat.width/2 + (Math.random() - 0.5) * 30,
                                y: cat.y + cat.height,
                                vx: (Math.random() - 0.5) * 5,
                                vy: -Math.random() * 4 - 1,
                                life: 20 + Math.random() * 15,
                                color: Math.random() > 0.5 ? '#FFD700' : '#FFFFFF',
                                size: 2 + Math.random() * 2
                            });
                        }
                    }
                }
            });
            
            springs.forEach(s => {
                if (!s.active &&
                    cat.x + cat.width > s.x &&
                    cat.x < s.x + s.width &&
                    cat.y + cat.height >= s.y &&
                    cat.y + cat.height - cat.vy <= s.y + s.height) {
                    
                    cat.vy = cat.jumpPower * 1.8;
                    s.active = true;
                    s.compressTimer = 10;
                    createParticles(s.x + s.width/2, s.y, '#FFD700', 12);
                    playSound('spring');
                }
            });
        }
        
        function update() {
            if (gameState !== 'playing') return;
            
            // 水平移动 - 优先重力感应，其次键盘，最后触摸
            if (useTilt && Math.abs(tiltGamma) > 1.5) {
                const sensitivity = cat.speed / 15;
                cat.vx = tiltGamma * sensitivity;
                cat.vx = Math.max(-cat.speed, Math.min(cat.speed, cat.vx));
                cat.facing = tiltGamma > 0 ? 1 : -1;
            } else if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
                cat.vx = -cat.speed;
                cat.facing = -1;
            } else if (keys['ArrowRight'] || keys['d'] || keys['D']) {
                cat.vx = cat.speed;
                cat.facing = 1;
            } else if (touchX !== null) {
                if (touchX < canvas.width / 2) {
                    cat.vx = -cat.speed;
                    cat.facing = -1;
                } else {
                    cat.vx = cat.speed;
                    cat.facing = 1;
                }
            } else {
                cat.vx *= 0.8;
            }
            
            cat.vy += cat.gravity;
            
            cat.x += cat.vx;
            cat.y += cat.vy;
            
            // 跳跃拖尾效果（快速上升时产生蓝色能量粒子）
            if (cat.vy < -8 && Math.random() < 0.4) {
                particles.push({
                    x: cat.x + cat.width/2 + (Math.random() - 0.5) * 20,
                    y: cat.y + cat.height + 5,
                    vx: (Math.random() - 0.5) * 2,
                    vy: Math.random() * 3 + 1,
                    life: 15 + Math.random() * 10,
                    color: Math.random() > 0.5 ? '#00D4FF' : '#4FC3F7',
                    size: 2 + Math.random() * 3
                });
            }
            
            if (cat.x + cat.width < 0) {
                cat.x = canvas.width;
            } else if (cat.x > canvas.width) {
                cat.x = -cat.width;
            }
            
            // 相机跟随 - 保持明治在屏幕偏下方（约60%处）
            const threshold = canvas.height * 0.6;
            const targetCameraY = threshold - cat.y;
            if (targetCameraY > cameraY) {
                cameraY = targetCameraY;
            }
            
            const currentHeight = Math.floor((canvas.height - 50 - cat.y) / 10);
            if (currentHeight > score) {
                score = currentHeight;
                document.getElementById('score').textContent = score;
                if (score % 10 === 0) playSound('coin');
            }
            
            generatePlatforms();
            cleanupPlatforms();
            
            platforms.forEach(p => {
                if (p.type === 'moving' && !p.broken) {
                    p.x += p.moveSpeed;
                    if (Math.abs(p.x - p.originalX) > p.moveRange) {
                        p.moveSpeed *= -1;
                    }
                    if (p.x < 0) p.x = 0;
                    if (p.x + p.width > canvas.width) p.x = canvas.width - p.width;
                }
                
                if (p.broken && p.breakTimer < 10) {
                    p.breakTimer++;
                }
            });
            
            springs.forEach(s => {
                if (s.compressTimer > 0) {
                    s.compressTimer--;
                    if (s.compressTimer === 0) s.active = false;
                }
            });
            
            checkCollisions();
            
            clouds.forEach(c => {
                c.x += c.speed;
                if (c.x > canvas.width + c.width) {
                    c.x = -c.width;
                    c.y = Math.random() * canvas.height - cameraY * 0.2;
                }
            });
            
            if (cat.y + cameraY > canvas.height + 50) {
                gameOver();
            }
        }
        
        function drawBlackHole() {
            const bhX = canvas.width * 0.82;
            const bhY = canvas.height * 0.18 + cameraY * 0.03;
            const bhR = 35;
            
            // 引力透镜扭曲效果（外围光晕）
            const lensGradient = ctx.createRadialGradient(bhX, bhY, bhR * 1.2, bhX, bhY, bhR * 3);
            lensGradient.addColorStop(0, 'rgba(255, 255, 255, 0)');
            lensGradient.addColorStop(0.5, 'rgba(100, 150, 255, 0.05)');
            lensGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = lensGradient;
            ctx.beginPath();
            ctx.arc(bhX, bhY, bhR * 3, 0, Math.PI * 2);
            ctx.fill();
            
            // 旋转的吸积盘
            const time = Date.now() * 0.0005;
            for (let i = 0; i < 3; i++) {
                const angle = time + (i * Math.PI * 2 / 3);
                const rx = bhR * (1.3 + i * 0.4);
                const ry = bhR * (0.4 + i * 0.15);
                
                ctx.save();
                ctx.translate(bhX, bhY);
                ctx.rotate(angle);
                
                const diskColors = ['#FF6B35', '#FFD700', '#87CEEB'];
                ctx.strokeStyle = diskColors[i];
                ctx.lineWidth = 2 + i;
                ctx.globalAlpha = 0.6 - i * 0.15;
                ctx.beginPath();
                ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }
            ctx.globalAlpha = 1;
            
            // 事件视界（黑色核心）
            const coreGradient = ctx.createRadialGradient(bhX, bhY, 0, bhX, bhY, bhR);
            coreGradient.addColorStop(0, '#000000');
            coreGradient.addColorStop(0.7, '#000000');
            coreGradient.addColorStop(0.85, '#1a0a2e');
            coreGradient.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = coreGradient;
            ctx.beginPath();
            ctx.arc(bhX, bhY, bhR, 0, Math.PI * 2);
            ctx.fill();
        }
        
        let spaceships = [];
        function initSpaceships() {
            spaceships = [];
            for (let i = 0; i < 3; i++) {
                spaceships.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height * 2,
                    speed: 0.3 + Math.random() * 0.5,
                    size: 15 + Math.random() * 10,
                    angle: Math.random() * Math.PI * 2
                });
            }
        }
        
        function drawSpaceships() {
            spaceships.forEach(s => {
                const screenY = s.y + cameraY * 0.15;
                if (screenY < -50 || screenY > canvas.height + 50) return;
                
                s.x += s.speed;
                if (s.x > canvas.width + 50) s.x = -50;
                
                ctx.save();
                ctx.translate(s.x, screenY);
                ctx.rotate(s.angle);
                
                // 飞船主体
                ctx.fillStyle = '#C0C0C0';
                ctx.beginPath();
                ctx.moveTo(s.size, 0);
                ctx.lineTo(-s.size * 0.5, -s.size * 0.4);
                ctx.lineTo(-s.size * 0.3, 0);
                ctx.lineTo(-s.size * 0.5, s.size * 0.4);
                ctx.closePath();
                ctx.fill();
                
                // 驾驶舱
                ctx.fillStyle = '#4FC3F7';
                ctx.beginPath();
                ctx.arc(s.size * 0.2, 0, s.size * 0.2, 0, Math.PI * 2);
                ctx.fill();
                
                // 引擎尾焰
                const flameLen = s.size * (0.8 + Math.random() * 0.4);
                ctx.fillStyle = `rgba(255, ${100 + Math.random() * 100}, 0, 0.8)`;
                ctx.beginPath();
                ctx.moveTo(-s.size * 0.3, -s.size * 0.15);
                ctx.lineTo(-s.size * 0.3 - flameLen, 0);
                ctx.lineTo(-s.size * 0.3, s.size * 0.15);
                ctx.closePath();
                ctx.fill();
                
                ctx.restore();
            });
        }
        
        function draw() {
            // 深空背景
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#050510');
            gradient.addColorStop(0.4, '#0a0a1a');
            gradient.addColorStop(0.7, '#0d1020');
            gradient.addColorStop(1, '#080818');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 星云色彩（远处）
            const nebula = ctx.createRadialGradient(
                canvas.width * 0.2, canvas.height * 0.3 + cameraY * 0.02, 0,
                canvas.width * 0.2, canvas.height * 0.3 + cameraY * 0.02, canvas.width * 0.6
            );
            nebula.addColorStop(0, 'rgba(80, 40, 120, 0.08)');
            nebula.addColorStop(0.5, 'rgba(40, 60, 120, 0.04)');
            nebula.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = nebula;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            drawBlackHole();
            drawStars();
            drawClouds();
            drawSpaceships();
            drawClouds();
            platforms.forEach(drawPlatform);
            drawSprings();
            drawCat();
            drawParticles();
        }
        
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        function handleOrientation(event) {
            // iOS 18 有时 gamma 为 null，尝试用 beta 代替（竖屏时左右倾斜）
            if (event.gamma !== null && !isNaN(event.gamma)) {
                tiltGamma = event.gamma;
            } else if (event.beta !== null && !isNaN(event.beta)) {
                tiltGamma = event.beta;
            }
        }
        
        function handleMotion(event) {
            // iOS 18 更倾向于通过 devicemotion 提供数据
            if (event.rotationRate && event.rotationRate.gamma !== null) {
                // 旋转速率（度/秒），积分近似角度
                tiltGamma = event.rotationRate.gamma * 0.3;
            } else if (event.accelerationIncludingGravity && event.accelerationIncludingGravity.x !== null) {
                const accel = event.accelerationIncludingGravity;
                tiltGamma = accel.x * 3;
            }
        }
        
        async function requestTiltPermission() {
            if (tiltRequested) return;
            tiltRequested = true;
            
            const needsOrientPermission = typeof DeviceOrientationEvent !== 'undefined' && 
                                          typeof DeviceOrientationEvent.requestPermission === 'function';
            const needsMotionPermission = typeof DeviceMotionEvent !== 'undefined' && 
                                          typeof DeviceMotionEvent.requestPermission === 'function';
            
            if (needsOrientPermission || needsMotionPermission) {
                try {
                    // iOS 需要同时请求两种权限
                    const promises = [];
                    if (needsOrientPermission) {
                        promises.push(DeviceOrientationEvent.requestPermission());
                    }
                    if (needsMotionPermission) {
                        promises.push(DeviceMotionEvent.requestPermission());
                    }
                    
                    const results = await Promise.all(promises);
                    const anyGranted = results.some(r => r === 'granted');
                    
                    if (anyGranted) {
                        window.addEventListener('deviceorientation', handleOrientation);
                        window.addEventListener('devicemotion', handleMotion);
                        useTilt = true;
                    } else {
                        showTiltHelp();
                    }
                } catch (err) {
                    fallbackTilt();
                }
            } else {
                fallbackTilt();
            }
        }
        
        function fallbackTilt() {
            window.addEventListener('deviceorientation', handleOrientation);
            window.addEventListener('devicemotion', handleMotion);
            useTilt = true;
        }
        
        function showTiltHelp() {
            const hint = document.querySelector('.controls-hint');
            if (hint) {
                hint.innerHTML = '手机: <b style="color:#FFD700">倾斜手机左右移动</b><br>' +
                    '<span style="color:#FF6B6B;font-size:11px;">⚠️ 请在 设置 → Safari → 动作与方向 开启权限</span><br>' +
                    '<span style="color:rgba(255,255,255,0.5);">或点击屏幕左右侧控制</span>';
            }
        }
        
        function startGame() {
            // 保存玩家名字
            const nameInput = document.getElementById('player-name');
            if (nameInput) {
                playerName = nameInput.value.trim() || '匿名';
                localStorage.setItem('catJumpPlayerName', playerName);
            }
            
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            
            score = 0;
            cameraY = 0;
            particles = [];
            springs = [];
            document.getElementById('score').textContent = '0';
            
            initCat();
            initPlatforms();
            initClouds();
            initStars();
            initSpaceships();
            initAudio();
            startBGM();
            
            gameState = 'playing';
            requestTiltPermission();
        }
        
        function gameOver() {
            gameState = 'gameover';
            fadeOutBGM();
            playSound('gameover');
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('catJumpHighScore', highScore);
            }
            
            // 保存到排行榜
            addScore(playerName, score);
            
            document.getElementById('final-score').textContent = '得分: ' + score;
            document.getElementById('final-high').textContent = '最高: ' + highScore;
            document.getElementById('high-score').textContent = '最高: ' + highScore;
            renderLeaderboard();
            document.getElementById('game-over-screen').classList.remove('hidden');
        }
        
        function restartGame() {
            startGame();
        }
        
        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) {
                e.preventDefault();
            }
        });
        
        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });
        
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            touchX = e.touches[0].clientX;
        }, { passive: false });
        
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            touchX = e.touches[0].clientX;
        }, { passive: false });
        
        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            touchX = null;
        }, { passive: false });
        
        canvas.addEventListener('mousedown', (e) => {
            touchX = e.clientX;
        });
        
        canvas.addEventListener('mousemove', (e) => {
            if (touchX !== null) {
                touchX = e.clientX;
            }
        });
        
        canvas.addEventListener('mouseup', () => {
            touchX = null;
        });
        
        canvas.addEventListener('mouseleave', () => {
            touchX = null;
        });
        
        initClouds();
        initStars();
        initCloudLeaderboard();
        draw();
        gameLoop();
        
        // 页面关闭时清理 Firebase 监听
        window.addEventListener('beforeunload', () => {
            if (leaderboardUnsubscribe) {
                leaderboardUnsubscribe();
                leaderboardUnsubscribe = null;
            }
        });
        
        // 尝试自动播放 BGM（可能被浏览器阻止，用户交互后会再次尝试）
        if (soundEnabled) {
            document.addEventListener('click', function tryStartBGM() {
                startBGM();
                document.removeEventListener('click', tryStartBGM);
            }, { once: true });
        }
    </script>
</body>
