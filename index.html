<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>明治太空跳 - Space Jump</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0d0603;
            overflow: hidden;
            font-family: 'Nunito', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block;
            margin: 0 auto;
        }
        #game-ui {
            position: absolute;
            top: 24px;
            left: 0;
            width: 100%;
            text-align: center;
            pointer-events: none;
            z-index: 5;
        }
        #score {
            font-size: 40px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.4), 0 0 25px rgba(255,215,0,0.4);
            letter-spacing: 2px;
            line-height: 1;
        }
        #high-score {
            font-size: 13px;
            color: rgba(255,255,255,0.6);
            margin-top: 6px;
            font-weight: 700;
            text-shadow: 0 1px 3px rgba(0,0,0,0.3);
            letter-spacing: 1px;
        }
        #start-screen, #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.35);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 10;
            transition: opacity 0.3s;
        }
        #start-screen h1 {
            font-size: 56px;
            font-weight: 900;
            color: #FFD700;
            text-shadow: 0 4px 15px rgba(0,0,0,0.5), 0 0 40px rgba(255,215,0,0.3);
            margin-bottom: 8px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
        #start-screen p {
            font-size: 18px;
            color: rgba(255,255,255,0.85);
            margin-bottom: 40px;
            font-weight: 700;
            text-shadow: 0 1px 5px rgba(0,0,0,0.3);
        }
        .btn {
            padding: 16px 50px;
            font-size: 22px;
            background: linear-gradient(135deg, #FFD700 0%, #FF8C00 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 900;
            color: #1a1a2e;
            box-shadow: 0 6px 25px rgba(255,140,0,0.45), 0 2px 5px rgba(0,0,0,0.2);
            transition: all 0.2s ease;
            pointer-events: all;
            font-family: 'Nunito', sans-serif;
            letter-spacing: 1px;
        }
        .btn:hover {
            transform: translateY(-3px) scale(1.06);
            box-shadow: 0 10px 30px rgba(255,140,0,0.55), 0 4px 10px rgba(0,0,0,0.25);
        }
        .btn:active {
            transform: translateY(1px) scale(0.97);
        }
        #game-over-screen h2 {
            font-size: 48px;
            font-weight: 900;
            color: #FF6B6B;
            margin-bottom: 18px;
            text-shadow: 0 3px 12px rgba(0,0,0,0.4);
        }
        #game-over-screen p {
            font-size: 22px;
            color: #fff;
            margin-bottom: 10px;
            font-weight: 700;
            text-shadow: 0 1px 5px rgba(0,0,0,0.3);
        }
        .hidden {
            display: none !important;
        }
        .controls-hint {
            margin-top: 28px;
            color: rgba(255,255,255,0.5);
            font-size: 13px;
            text-align: center;
            line-height: 1.9;
            font-weight: 400;
        }
        .name-input {
            padding: 12px 24px;
            font-size: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 30px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            text-align: center;
            margin-bottom: 20px;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            outline: none;
            width: 200px;
            transition: border-color 0.2s;
        }
        .name-input::placeholder {
            color: rgba(255,255,255,0.4);
        }
        .name-input:focus {
            border-color: #FFD700;
        }
        .challenge-banner {
            background: linear-gradient(135deg, rgba(255,215,0,0.2), rgba(255,140,0,0.2));
            border: 1px solid rgba(255,215,0,0.4);
            border-radius: 16px;
            padding: 12px 20px;
            margin-bottom: 20px;
            color: #FFD700;
            font-size: 15px;
            font-weight: 700;
            max-width: 280px;
            text-align: center;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
        .leaderboard {
            background: rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 16px 20px;
            margin: 15px 0;
            width: 260px;
            max-height: 180px;
            overflow-y: auto;
        }
        .leaderboard h3 {
            font-size: 16px;
            color: #FFD700;
            margin-bottom: 10px;
            text-align: center;
        }
        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 14px;
            color: rgba(255,255,255,0.85);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .leaderboard-item:last-child {
            border-bottom: none;
        }
        .leaderboard-item .rank {
            font-weight: 900;
            width: 24px;
        }
        .leaderboard-item .name {
            flex: 1;
            text-align: left;
            padding-left: 8px;
        }
        .leaderboard-item .score {
            font-weight: 900;
            color: #FFD700;
        }
        .share-btn {
            padding: 10px 24px;
            font-size: 14px;
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 900;
            color: #fff;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(76,175,80,0.4);
            transition: all 0.2s;
            font-family: 'Nunito', sans-serif;
        }
        .share-btn:hover {
            transform: translateY(-2px) scale(1.05);
        }
        .share-btn:active {
            transform: translateY(1px) scale(0.97);
        }
        .btn-row {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="game-ui">
        <div id="score">0</div>
        <div id="high-score">最高: 0</div>
    </div>
    
    <div id="start-screen">
        <h1>🚀 明治太空跳</h1>
        <p>帮助明治飞向宇宙！</p>
        <div id="challenge-banner" class="challenge-banner hidden"></div>
        <input type="text" id="player-name" class="name-input" placeholder="输入你的名字" maxlength="8">
        <button class="btn" onclick="startGame()">开始游戏</button>
        <div class="controls-hint">
            电脑: ← → 方向键 或 A D 键<br>
            手机: 倾斜手机左右移动
        </div>
    </div>
    
    <div id="game-over-screen" class="hidden">
        <h2>游戏结束</h2>
        <p id="final-score">得分: 0</p>
        <p id="final-high">最高: 0</p>
        <div id="leaderboard" class="leaderboard"></div>
        <div class="btn-row">
            <button class="btn" onclick="restartGame()">再玩一次</button>
            <button class="share-btn" onclick="shareChallenge()">📤 分享挑战</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        let gameState = 'menu';
        let score = 0;
        let highScore = localStorage.getItem('catJumpHighScore') || 0;
        document.getElementById('high-score').textContent = '最高: ' + highScore;
        
        let cameraY = 0;
        let maxHeight = 0;
        
        // 排行榜系统
        let playerName = localStorage.getItem('catJumpPlayerName') || '';
        const nameInput = document.getElementById('player-name');
        if (nameInput) nameInput.value = playerName;
        
        function getLeaderboard() {
            try {
                return JSON.parse(localStorage.getItem('catJumpLeaderboard')) || [];
            } catch (e) {
                return [];
            }
        }
        
        function saveLeaderboard(data) {
            localStorage.setItem('catJumpLeaderboard', JSON.stringify(data));
        }
        
        function addScore(name, score) {
            const board = getLeaderboard();
            board.push({ name: name || '匿名', score: score, date: Date.now() });
            board.sort((a, b) => b.score - a.score);
            // 只保留前 20 条
            if (board.length > 20) board.length = 20;
            saveLeaderboard(board);
            return board;
        }
        
        function renderLeaderboard() {
            const board = getLeaderboard();
            const container = document.getElementById('leaderboard');
            if (!container) return;
            
            if (board.length === 0) {
                container.innerHTML = '<h3>🏆 排行榜</h3><p style="color:rgba(255,255,255,0.5);text-align:center;font-size:13px;">暂无记录</p>';
                return;
            }
            
            let html = '<h3>🏆 排行榜</h3>';
            board.slice(0, 10).forEach((item, i) => {
                const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1) + '.';
                html += `<div class="leaderboard-item">
                    <span class="rank">${medal}</span>
                    <span class="name">${escapeHtml(item.name)}</span>
                    <span class="score">${item.score}</span>
                </div>`;
            });
            container.innerHTML = html;
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function shareChallenge() {
            const name = playerName || '匿名';
            const url = new URL(window.location.href);
            url.searchParams.set('c', name + ':' + score);
            const shareUrl = url.toString();
            
            if (navigator.share) {
                navigator.share({
                    title: '明治太空跳挑战',
                    text: `${name} 在明治太空跳中得了 ${score} 分！你能超过他吗？`,
                    url: shareUrl
                }).catch(() => {});
            } else if (navigator.clipboard) {
                navigator.clipboard.writeText(shareUrl).then(() => {
                    alert('挑战链接已复制到剪贴板！发给朋友来比拼吧 🐱');
                }).catch(() => {
                    prompt('复制以下链接分享给朋友：', shareUrl);
                });
            } else {
                prompt('复制以下链接分享给朋友：', shareUrl);
            }
        }
        
        function checkChallenge() {
            const url = new URL(window.location.href);
            const challenge = url.searchParams.get('c');
            if (!challenge) return null;
            
            const parts = challenge.split(':');
            if (parts.length !== 2) return null;
            
            return {
                name: decodeURIComponent(parts[0]),
                score: parseInt(parts[1]) || 0
            };
        }
        
        // 页面加载时检查挑战
        const challengeInfo = checkChallenge();
        if (challengeInfo) {
            const banner = document.getElementById('challenge-banner');
            if (banner) {
                banner.textContent = `🏆 ${escapeHtml(challengeInfo.name)} 向你发起挑战！得分：${challengeInfo.score}`;
                banner.classList.remove('hidden');
            }
        }
        
        const cat = {
            x: 0,
            y: 0,
            width: 40,
            height: 40,
            vx: 0,
            vy: 0,
            speed: 5,
            jumpPower: -13,
            gravity: 0.4,
            facing: 1,
            animFrame: 0,
            animTimer: 0
        };
        
        let platforms = [];
        const PLATFORM_WIDTH = 70;
        const PLATFORM_HEIGHT = 12;
        const PLATFORM_GAP_MIN = 50;
        const PLATFORM_GAP_MAX = 120;
        
        let clouds = [];
        let particles = [];
        let stars = [];
        
        const keys = {};
        let touchX = null;
        let tiltGamma = 0;
        let useTilt = false;
        let tiltRequested = false;
        
        function initCat() {
            cat.x = canvas.width / 2 - cat.width / 2;
            cat.y = canvas.height - 200;
            cat.vx = 0;
            cat.vy = cat.jumpPower;
            cat.facing = 1;
        }
        
        function createPlatform(y) {
            const types = ['normal', 'normal', 'normal', 'moving', 'fragile'];
            const type = types[Math.floor(Math.random() * types.length)];
            const x = Math.random() * (canvas.width - PLATFORM_WIDTH);
            
            return {
                x: x,
                y: y,
                width: PLATFORM_WIDTH,
                height: PLATFORM_HEIGHT,
                type: type,
                originalX: x,
                moveSpeed: type === 'moving' ? (Math.random() > 0.5 ? 2 : -2) : 0,
                moveRange: type === 'moving' ? 80 : 0,
                broken: false,
                breakTimer: 0
            };
        }
        
        function initPlatforms() {
            platforms = [];
            platforms.push({
                x: canvas.width / 2 - PLATFORM_WIDTH / 2,
                y: canvas.height - 50,
                width: PLATFORM_WIDTH + 40,
                height: PLATFORM_HEIGHT,
                type: 'normal',
                originalX: canvas.width / 2 - PLATFORM_WIDTH / 2 - 20,
                moveSpeed: 0,
                moveRange: 0,
                broken: false,
                breakTimer: 0
            });
            
            let currentY = canvas.height - 50;
            while (currentY > -canvas.height * 2) {
                currentY -= PLATFORM_GAP_MIN + Math.random() * (PLATFORM_GAP_MAX - PLATFORM_GAP_MIN);
                platforms.push(createPlatform(currentY));
            }
        }
        
        function initClouds() {
            clouds = [];
            // 月亮
            clouds.push({
                x: canvas.width * 0.75,
                y: canvas.height * 0.15,
                width: 80,
                speed: 0.02,
                opacity: 0.6,
                type: 'moon'
            });
            // 远处城市灯光
            for (let i = 0; i < 12; i++) {
                clouds.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height * 3,
                    width: 30 + Math.random() * 50,
                    speed: 0.05 + Math.random() * 0.1,
                    opacity: 0.1 + Math.random() * 0.2,
                    type: 'citylight'
                });
            }
        }
        
        function initStars() {
            stars = [];
            for (let i = 0; i < 100; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height * 4,
                    size: Math.random() * 2 + 0.5,
                    opacity: Math.random() * 0.8 + 0.2,
                    twinkle: Math.random() * Math.PI * 2
                });
            }
        }
        
        function generatePlatforms() {
            let topPlatform = platforms[platforms.length - 1];
            while (topPlatform.y + cameraY > -canvas.height) {
                const newY = topPlatform.y - PLATFORM_GAP_MIN - Math.random() * (PLATFORM_GAP_MAX - PLATFORM_GAP_MIN);
                platforms.push(createPlatform(newY));
                topPlatform = platforms[platforms.length - 1];
                
                if (Math.random() < 0.05) {
                    springs.push({
                        x: topPlatform.x + topPlatform.width / 2 - 10,
                        y: topPlatform.y - 15,
                        width: 20,
                        height: 15,
                        active: false,
                        compressTimer: 0
                    });
                }
            }
        }
        
        function cleanupPlatforms() {
            // 只保留屏幕上下各 2 屏范围内的平台，防止数组无限膨胀
            platforms = platforms.filter(p => p.y + cameraY > -canvas.height * 2 && p.y + cameraY < canvas.height + 100);
            springs = springs.filter(s => s.y + cameraY > -canvas.height * 2 && s.y + cameraY < canvas.height + 100);
        }
        
        let springs = [];
        
        window.catImage = new Image();
        window.catImage.src = 'mingzhi.png?v=3';
        
        function roundRect(ctx, x, y, w, h, r) {
            if (typeof r === 'number') r = {tl: r, tr: r, br: r, bl: r};
            ctx.beginPath();
            ctx.moveTo(x + r.tl, y);
            ctx.lineTo(x + w - r.tr, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r.tr);
            ctx.lineTo(x + w, y + h - r.br);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r.br, y + h);
            ctx.lineTo(x + r.bl, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r.bl);
            ctx.lineTo(x, y + r.tl);
            ctx.quadraticCurveTo(x, y, x + r.tl, y);
            ctx.closePath();
        }
        
        function drawCat() {
            ctx.save();
            const screenY = cat.y + cameraY;
            const cx = cat.x + cat.width / 2;
            const cy = screenY + cat.height / 2;
            
            // 可爱的弹跳缩放：跳跃时压扁，下落时拉长
            const squash = Math.max(-0.15, Math.min(0.15, cat.vy * 0.008));
            const scaleX = cat.facing * (1 + squash);
            const scaleY = 1 - squash;
            
            ctx.translate(cx, cy);
            ctx.scale(scaleX, scaleY);
            ctx.translate(-cx, -cy);
            
            if (window.catImage.complete && window.catImage.naturalWidth > 0) {
                const imgSize = 55;
                ctx.imageSmoothingEnabled = false;
                // 先画一个椭圆形阴影在脚下，不会覆盖透明区域
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.beginPath();
                ctx.ellipse(cx, cy + imgSize/2 - 2, imgSize * 0.35, imgSize * 0.1, 0, 0, Math.PI * 2);
                ctx.fill();
                // 再画明治本体
                ctx.drawImage(window.catImage, cx - imgSize/2, cy - imgSize/2 + 2, imgSize, imgSize);
            } else {
                ctx.fillStyle = '#FFAA55';
                roundRect(ctx, cat.x, screenY, cat.width, cat.height, 10);
                ctx.fill();
                ctx.fillStyle = '#333';
                ctx.font = 'bold 20px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('🐱', cat.x + cat.width/2, screenY + 30);
            }
            
            ctx.restore();
        }
        
        function drawPlatform(p) {
            if (p.broken) return;
            
            const screenY = p.y + cameraY;
            if (screenY < -50 || screenY > canvas.height + 50) return;
            
            ctx.save();
            const r = 6;
            
            if (p.type === 'normal') {
                // 太空站金属平台
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 10;
                ctx.shadowOffsetY = 4;
                
                // 平台主体（深灰金属）
                roundRect(ctx, p.x, screenY, p.width, p.height, r);
                ctx.fillStyle = '#3a3a4a';
                ctx.fill();
                
                // 金属高光条
                ctx.fillStyle = '#5a5a6a';
                ctx.fillRect(p.x + 3, screenY + 2, p.width - 6, 3);
                
                // 铆钉/螺丝细节
                ctx.fillStyle = '#888899';
                ctx.beginPath();
                ctx.arc(p.x + 8, screenY + p.height/2, 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(p.x + p.width - 8, screenY + p.height/2, 2, 0, Math.PI * 2);
                ctx.fill();
                
                // 侧面厚度
                ctx.fillStyle = '#2a2a3a';
                roundRect(ctx, p.x, screenY + p.height * 0.6, p.width, p.height * 0.4, {tl: 0, tr: 0, bl: r, br: r});
                ctx.fill();
                
                ctx.shadowColor = 'transparent';
                
            } else if (p.type === 'moving') {
                // 能量平台（发光）
                ctx.shadowColor = 'rgba(0,200,255,0.5)';
                ctx.shadowBlur = 15;
                ctx.shadowOffsetY = 2;
                
                // 能量核心
                roundRect(ctx, p.x + 2, screenY + 2, p.width - 4, p.height - 4, r);
                ctx.fillStyle = '#0a2a3a';
                ctx.fill();
                
                // 发光边缘
                ctx.strokeStyle = '#00D4FF';
                ctx.lineWidth = 2;
                roundRect(ctx, p.x + 2, screenY + 2, p.width - 4, p.height - 4, r);
                ctx.stroke();
                
                // 中心能量条
                ctx.fillStyle = 'rgba(0, 212, 255, 0.6)';
                ctx.fillRect(p.x + 8, screenY + p.height/2 - 1, p.width - 16, 2);
                
                // 脉冲光点
                const pulse = 0.5 + 0.5 * Math.sin(Date.now() * 0.005);
                ctx.fillStyle = `rgba(0, 212, 255, ${pulse})`;
                ctx.beginPath();
                ctx.arc(p.x + p.width/2, screenY + p.height/2, 3, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.shadowColor = 'transparent';
                
            } else if (p.type === 'fragile') {
                // 碎裂小行星平台
                ctx.shadowColor = 'rgba(0,0,0,0.4)';
                ctx.shadowBlur = 6;
                ctx.shadowOffsetY = 2;
                
                // 岩石主体
                roundRect(ctx, p.x, screenY, p.width, p.height, r);
                ctx.fillStyle = '#5a4a3a';
                ctx.fill();
                
                // 陨石坑/裂纹
                ctx.fillStyle = '#3a2a1a';
                ctx.beginPath();
                ctx.arc(p.x + 15, screenY + 5, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(p.x + p.width - 12, screenY + 7, 3, 0, Math.PI * 2);
                ctx.fill();
                
                // 高亮边缘（即将碎裂的警告）
                ctx.strokeStyle = 'rgba(255, 100, 50, 0.4)';
                ctx.lineWidth = 1;
                roundRect(ctx, p.x + 1, screenY + 1, p.width - 2, p.height - 2, r);
                ctx.stroke();
                
                ctx.shadowColor = 'transparent';
            }
            
            ctx.restore();
        }
        
        function drawSprings() {
            springs.forEach(s => {
                const screenY = s.y + cameraY;
                if (screenY < -50 || screenY > canvas.height + 50) return;
                
                ctx.save();
                
                // 推进器底座
                ctx.fillStyle = '#4a4a5a';
                roundRect(ctx, s.x + 2, screenY + 5, s.width - 4, s.height - 5, 2);
                ctx.fill();
                
                // 推进器喷嘴
                ctx.fillStyle = '#FF4500';
                ctx.beginPath();
                ctx.moveTo(s.x + s.width/2, screenY + s.height);
                ctx.lineTo(s.x + 4, screenY + 5);
                ctx.lineTo(s.x + s.width - 4, screenY + 5);
                ctx.closePath();
                ctx.fill();
                
                // 火焰效果（如果激活）
                if (s.active || s.compressTimer > 0) {
                    ctx.fillStyle = `rgba(0, 212, 255, ${0.6 + Math.random() * 0.4})`;
                    ctx.beginPath();
                    ctx.moveTo(s.x + s.width/2, screenY + s.height + 8);
                    ctx.lineTo(s.x + 6, screenY + s.height);
                    ctx.lineTo(s.x + s.width - 6, screenY + s.height);
                    ctx.closePath();
                    ctx.fill();
                }
                
                ctx.restore();
            });
        }
        
        function drawClouds() {
            // 窗外夜景元素 - 月亮和远处的城市灯光
            clouds.forEach(c => {
                const screenY = c.y + cameraY * 0.2;
                if (screenY < -120 || screenY > canvas.height + 120) return;
                
                if (c.type === 'moon') {
                    // 月亮
                    ctx.fillStyle = `rgba(255, 240, 200, ${c.opacity})`;
                    ctx.beginPath();
                    ctx.arc(c.x, screenY, c.width * 0.3, 0, Math.PI * 2);
                    ctx.fill();
                    // 月光晕
                    ctx.fillStyle = `rgba(255, 240, 200, ${c.opacity * 0.1})`;
                    ctx.beginPath();
                    ctx.arc(c.x, screenY, c.width * 0.6, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // 远处建筑灯光
                    ctx.fillStyle = `rgba(200, 180, 140, ${c.opacity * 0.5})`;
                    ctx.beginPath();
                    ctx.arc(c.x, screenY, c.width * 0.2, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }
        
        function drawStars() {
            stars.forEach(s => {
                const screenY = s.y + cameraY * 0.08;
                if (screenY < -10 || screenY > canvas.height + 10) return;
                
                s.twinkle += 0.025;
                const alpha = s.opacity * (0.5 + 0.5 * Math.sin(s.twinkle));
                
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.beginPath();
                ctx.arc(s.x, screenY, s.size, 0, Math.PI * 2);
                ctx.fill();
            });
        }
        
        function drawParticles() {
            particles.forEach((p, i) => {
                p.life--;
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.08;
                
                if (p.life <= 0) {
                    particles.splice(i, 1);
                    return;
                }
                
                const alpha = p.life / 30;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y + cameraY, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            });
        }
        
        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 5,
                    vy: (Math.random() - 0.5) * 5 - 2,
                    life: 25 + Math.random() * 25,
                    color: color,
                    size: 2 + Math.random() * 5
                });
            }
        }
        
        function checkCollisions() {
            platforms.forEach(p => {
                if (p.broken) return;
                
                if (cat.vy > 0 &&
                    cat.x + cat.width > p.x &&
                    cat.x < p.x + p.width &&
                    cat.y + cat.height >= p.y &&
                    cat.y + cat.height - cat.vy <= p.y + p.height) {
                    
                    if (p.type === 'fragile') {
                        p.broken = true;
                        createParticles(p.x + p.width/2, p.y, '#DEB887', 10);
                        cat.vy = cat.jumpPower * 0.7;
                    } else {
                        cat.y = p.y - cat.height;
                        cat.vy = cat.jumpPower;
                        createParticles(cat.x + cat.width/2, cat.y + cat.height, '#7CFC00', 6);
                    }
                }
            });
            
            springs.forEach(s => {
                if (!s.active &&
                    cat.x + cat.width > s.x &&
                    cat.x < s.x + s.width &&
                    cat.y + cat.height >= s.y &&
                    cat.y + cat.height - cat.vy <= s.y + s.height) {
                    
                    cat.vy = cat.jumpPower * 1.8;
                    s.active = true;
                    s.compressTimer = 10;
                    createParticles(s.x + s.width/2, s.y, '#FFD700', 12);
                }
            });
        }
        
        function update() {
            if (gameState !== 'playing') return;
            
            // 水平移动 - 优先重力感应，其次键盘，最后触摸
            if (useTilt && Math.abs(tiltGamma) > 1.5) {
                const sensitivity = cat.speed / 15;
                cat.vx = tiltGamma * sensitivity;
                cat.vx = Math.max(-cat.speed, Math.min(cat.speed, cat.vx));
                cat.facing = tiltGamma > 0 ? 1 : -1;
            } else if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
                cat.vx = -cat.speed;
                cat.facing = -1;
            } else if (keys['ArrowRight'] || keys['d'] || keys['D']) {
                cat.vx = cat.speed;
                cat.facing = 1;
            } else if (touchX !== null) {
                if (touchX < canvas.width / 2) {
                    cat.vx = -cat.speed;
                    cat.facing = -1;
                } else {
                    cat.vx = cat.speed;
                    cat.facing = 1;
                }
            } else {
                cat.vx *= 0.8;
            }
            
            cat.vy += cat.gravity;
            
            cat.x += cat.vx;
            cat.y += cat.vy;
            
            if (cat.x + cat.width < 0) {
                cat.x = canvas.width;
            } else if (cat.x > canvas.width) {
                cat.x = -cat.width;
            }
            
            // 相机跟随 - 保持明治在屏幕偏下方（约60%处）
            const threshold = canvas.height * 0.6;
            const targetCameraY = threshold - cat.y;
            if (targetCameraY > cameraY) {
                cameraY = targetCameraY;
            }
            
            const currentHeight = Math.floor((canvas.height - 50 - cat.y) / 10);
            if (currentHeight > score) {
                score = currentHeight;
                document.getElementById('score').textContent = score;
            }
            
            generatePlatforms();
            cleanupPlatforms();
            
            platforms.forEach(p => {
                if (p.type === 'moving' && !p.broken) {
                    p.x += p.moveSpeed;
                    if (Math.abs(p.x - p.originalX) > p.moveRange) {
                        p.moveSpeed *= -1;
                    }
                    if (p.x < 0) p.x = 0;
                    if (p.x + p.width > canvas.width) p.x = canvas.width - p.width;
                }
                
                if (p.broken && p.breakTimer < 10) {
                    p.breakTimer++;
                }
            });
            
            springs.forEach(s => {
                if (s.compressTimer > 0) {
                    s.compressTimer--;
                    if (s.compressTimer === 0) s.active = false;
                }
            });
            
            checkCollisions();
            
            clouds.forEach(c => {
                c.x += c.speed;
                if (c.x > canvas.width + c.width) {
                    c.x = -c.width;
                    c.y = Math.random() * canvas.height - cameraY * 0.2;
                }
            });
            
            if (cat.y + cameraY > canvas.height + 50) {
                gameOver();
            }
        }
        
        function drawBlackHole() {
            const bhX = canvas.width * 0.82;
            const bhY = canvas.height * 0.18 + cameraY * 0.03;
            const bhR = 35;
            
            // 引力透镜扭曲效果（外围光晕）
            const lensGradient = ctx.createRadialGradient(bhX, bhY, bhR * 1.2, bhX, bhY, bhR * 3);
            lensGradient.addColorStop(0, 'rgba(255, 255, 255, 0)');
            lensGradient.addColorStop(0.5, 'rgba(100, 150, 255, 0.05)');
            lensGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = lensGradient;
            ctx.beginPath();
            ctx.arc(bhX, bhY, bhR * 3, 0, Math.PI * 2);
            ctx.fill();
            
            // 旋转的吸积盘
            const time = Date.now() * 0.0005;
            for (let i = 0; i < 3; i++) {
                const angle = time + (i * Math.PI * 2 / 3);
                const rx = bhR * (1.3 + i * 0.4);
                const ry = bhR * (0.4 + i * 0.15);
                
                ctx.save();
                ctx.translate(bhX, bhY);
                ctx.rotate(angle);
                
                const diskColors = ['#FF6B35', '#FFD700', '#87CEEB'];
                ctx.strokeStyle = diskColors[i];
                ctx.lineWidth = 2 + i;
                ctx.globalAlpha = 0.6 - i * 0.15;
                ctx.beginPath();
                ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }
            ctx.globalAlpha = 1;
            
            // 事件视界（黑色核心）
            const coreGradient = ctx.createRadialGradient(bhX, bhY, 0, bhX, bhY, bhR);
            coreGradient.addColorStop(0, '#000000');
            coreGradient.addColorStop(0.7, '#000000');
            coreGradient.addColorStop(0.85, '#1a0a2e');
            coreGradient.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = coreGradient;
            ctx.beginPath();
            ctx.arc(bhX, bhY, bhR, 0, Math.PI * 2);
            ctx.fill();
        }
        
        let spaceships = [];
        function initSpaceships() {
            spaceships = [];
            for (let i = 0; i < 3; i++) {
                spaceships.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height * 2,
                    speed: 0.3 + Math.random() * 0.5,
                    size: 15 + Math.random() * 10,
                    angle: Math.random() * Math.PI * 2
                });
            }
        }
        
        function drawSpaceships() {
            spaceships.forEach(s => {
                const screenY = s.y + cameraY * 0.15;
                if (screenY < -50 || screenY > canvas.height + 50) return;
                
                s.x += s.speed;
                if (s.x > canvas.width + 50) s.x = -50;
                
                ctx.save();
                ctx.translate(s.x, screenY);
                ctx.rotate(s.angle);
                
                // 飞船主体
                ctx.fillStyle = '#C0C0C0';
                ctx.beginPath();
                ctx.moveTo(s.size, 0);
                ctx.lineTo(-s.size * 0.5, -s.size * 0.4);
                ctx.lineTo(-s.size * 0.3, 0);
                ctx.lineTo(-s.size * 0.5, s.size * 0.4);
                ctx.closePath();
                ctx.fill();
                
                // 驾驶舱
                ctx.fillStyle = '#4FC3F7';
                ctx.beginPath();
                ctx.arc(s.size * 0.2, 0, s.size * 0.2, 0, Math.PI * 2);
                ctx.fill();
                
                // 引擎尾焰
                const flameLen = s.size * (0.8 + Math.random() * 0.4);
                ctx.fillStyle = `rgba(255, ${100 + Math.random() * 100}, 0, 0.8)`;
                ctx.beginPath();
                ctx.moveTo(-s.size * 0.3, -s.size * 0.15);
                ctx.lineTo(-s.size * 0.3 - flameLen, 0);
                ctx.lineTo(-s.size * 0.3, s.size * 0.15);
                ctx.closePath();
                ctx.fill();
                
                ctx.restore();
            });
        }
        
        function draw() {
            // 深空背景
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#050510');
            gradient.addColorStop(0.4, '#0a0a1a');
            gradient.addColorStop(0.7, '#0d1020');
            gradient.addColorStop(1, '#080818');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 星云色彩（远处）
            const nebula = ctx.createRadialGradient(
                canvas.width * 0.2, canvas.height * 0.3 + cameraY * 0.02, 0,
                canvas.width * 0.2, canvas.height * 0.3 + cameraY * 0.02, canvas.width * 0.6
            );
            nebula.addColorStop(0, 'rgba(80, 40, 120, 0.08)');
            nebula.addColorStop(0.5, 'rgba(40, 60, 120, 0.04)');
            nebula.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = nebula;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            drawBlackHole();
            drawStars();
            drawClouds();
            drawSpaceships();
            drawClouds();
            platforms.forEach(drawPlatform);
            drawSprings();
            drawCat();
            drawParticles();
        }
        
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        function handleOrientation(event) {
            tiltGamma = event.gamma || 0;
        }
        
        function handleMotion(event) {
            const accel = event.accelerationIncludingGravity;
            if (accel && accel.x !== null) {
                // x轴加速度对应左右倾斜，范围约 -10 ~ 10
                tiltGamma = accel.x * 3;
            }
        }
        
        function requestTiltPermission() {
            if (tiltRequested) return;
            tiltRequested = true;
            
            // iOS 13+ 需要请求权限
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') {
                            useTilt = true;
                            window.addEventListener('deviceorientation', handleOrientation);
                        }
                    })
                    .catch(() => {
                        // iOS 权限被拒绝，尝试 devicemotion
                        tryMotion();
                    });
            } else if (typeof DeviceOrientationEvent !== 'undefined') {
                // Android 等支持 deviceorientation 的设备
                useTilt = true;
                window.addEventListener('deviceorientation', handleOrientation);
                // 同时监听 devicemotion 作为增强
                tryMotion();
            } else if (typeof DeviceMotionEvent !== 'undefined') {
                // 不支持 deviceorientation 但支持 devicemotion
                tryMotion();
            }
            // 桌面浏览器：都不支持，useTilt 保持 false，回退到触摸
        }
        
        function tryMotion() {
            if (typeof DeviceMotionEvent !== 'undefined') {
                useTilt = true;
                window.addEventListener('devicemotion', handleMotion);
            }
        }
        
        function startGame() {
            // 保存玩家名字
            const nameInput = document.getElementById('player-name');
            if (nameInput) {
                playerName = nameInput.value.trim() || '匿名';
                localStorage.setItem('catJumpPlayerName', playerName);
            }
            
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            
            score = 0;
            cameraY = 0;
            particles = [];
            springs = [];
            document.getElementById('score').textContent = '0';
            
            initCat();
            initPlatforms();
            initClouds();
            initStars();
            initSpaceships();
            
            gameState = 'playing';
            requestTiltPermission();
        }
        
        function gameOver() {
            gameState = 'gameover';
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('catJumpHighScore', highScore);
            }
            
            // 保存到排行榜
            addScore(playerName, score);
            
            document.getElementById('final-score').textContent = '得分: ' + score;
            document.getElementById('final-high').textContent = '最高: ' + highScore;
            document.getElementById('high-score').textContent = '最高: ' + highScore;
            renderLeaderboard();
            document.getElementById('game-over-screen').classList.remove('hidden');
        }
        
        function restartGame() {
            startGame();
        }
        
        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) {
                e.preventDefault();
            }
        });
        
        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });
        
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            touchX = e.touches[0].clientX;
        }, { passive: false });
        
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            touchX = e.touches[0].clientX;
        }, { passive: false });
        
        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            touchX = null;
        }, { passive: false });
        
        canvas.addEventListener('mousedown', (e) => {
            touchX = e.clientX;
        });
        
        canvas.addEventListener('mousemove', (e) => {
            if (touchX !== null) {
                touchX = e.clientX;
            }
        });
        
        canvas.addEventListener('mouseup', () => {
            touchX = null;
        });
        
        canvas.addEventListener('mouseleave', () => {
            touchX = null;
        });
        
        initClouds();
        initStars();
        draw();
        gameLoop();
    </script>
</body>
</html>
